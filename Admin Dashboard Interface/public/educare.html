<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EduCare Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#f1f5f9;color:#0f172a;height:100vh;display:flex;overflow:hidden;}

/* Sidebar */
#sidebar{width:210px;min-width:210px;background:#0f1623;display:flex;flex-direction:column;height:100vh;overflow-y:auto;}
.logo{padding:20px 16px 14px;}
.logo-brand{font-size:20px;font-weight:700;}
.logo-brand .edu{color:#fff;}.logo-brand .care{color:#60a5fa;}
.logo-sub{font-size:11px;color:#475569;margin-top:2px;}
nav{flex:1;padding:4px 8px;display:flex;flex-direction:column;gap:2px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:#94a3b8;font-size:13.5px;font-weight:500;transition:background .14s,color .14s;user-select:none;border:none;background:none;width:100%;text-align:left;font-family:inherit;}
.nav-item:hover{background:#1e2a3d;color:#e2e8f0;}
.nav-item.active{background:#2563eb;color:#fff;}
.school-card{margin:8px;background:#1e2a3d;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;}
.school-icon{width:36px;height:36px;background:#16a34a;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.school-name{font-size:11.5px;font-weight:600;color:#fff;line-height:1.4;}
.school-tag{font-size:10px;color:#475569;margin-top:1px;}

/* Main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#fff;border-bottom:1px solid #e2e8f0;flex-shrink:0;}
.search-box{display:flex;align-items:center;gap:8px;flex:1;max-width:380px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:7px 12px;color:#94a3b8;font-size:13px;}
.date-badge{display:flex;align-items:center;gap:6px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:6px 12px;font-size:12.5px;color:#64748b;}
.notif-btn{position:relative;width:36px;height:36px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.notif-dot{position:absolute;top:-3px;right:-3px;width:16px;height:16px;background:#dc2626;border-radius:50%;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.user-info{display:flex;align-items:center;gap:8px;cursor:pointer;}
.avatar{width:36px;height:36px;background:#2563eb;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0;}
.user-name{font-size:12px;font-weight:600;}
.user-role{font-size:11px;color:#64748b;}
#content{flex:1;overflow-y:auto;}
.page{display:none;padding:24px;}
.page.active{display:block;}

/* Shared */
.page-title{font-size:22px;font-weight:700;color:#0f172a;}
.page-sub{font-size:13px;color:#64748b;margin-top:3px;}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;}
.cp{padding:16px 18px;}
.stat-grid{display:grid;gap:12px;margin-bottom:18px;}
.stat-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;}
.stat-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-label{font-size:11.5px;color:#64748b;}
.stat-value{font-size:20px;font-weight:700;color:#0f172a;line-height:1.2;}
.stat-sub{font-size:11px;font-weight:500;margin-top:1px;}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;}
.bg{background:#dcfce7;color:#16a34a;}.by{background:#fef3c7;color:#d97706;}.br{background:#fee2e2;color:#dc2626;}
.bb{background:#dbeafe;color:#2563eb;}.bp{background:#ede9fe;color:#7c3aed;}.bpk{background:#fce7f3;color:#be185d;}
.bt{background:#ccfbf1;color:#0d9488;}.bo{background:#ffedd5;color:#ea580c;}.bgr{background:#f1f5f9;color:#475569;}
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.section-title{font-size:14px;font-weight:600;color:#0f172a;}
.btn-view{font-size:12px;color:#2563eb;cursor:pointer;font-weight:500;background:none;border:none;font-family:inherit;}
.action-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;cursor:pointer;font-size:12.5px;font-weight:500;color:#0f172a;width:100%;text-align:left;transition:background .12s;font-family:inherit;}
.action-btn:hover{background:#f8fafc;}
.btn-primary{display:inline-flex;align-items:center;gap:6px;background:#2563eb;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-primary:hover{background:#1d4ed8;}
.btn-outline{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#0f172a;border:1px solid #e2e8f0;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;}
.btn-outline:hover{background:#f8fafc;}
table{width:100%;border-collapse:collapse;}
th{font-size:12px;font-weight:600;color:#64748b;padding:10px 12px;text-align:left;border-bottom:1px solid #f1f5f9;}
td{font-size:13px;padding:11px 12px;border-bottom:1px solid #f8fafc;color:#0f172a;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafbfc;}
.icon-action{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#94a3b8;border:none;background:none;padding:0;}
.icon-action:hover{background:#f1f5f9;color:#475569;}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:#94a3b8;margin-bottom:16px;flex-wrap:wrap;}
.breadcrumb a{color:#2563eb;cursor:pointer;text-decoration:none;}
.class-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.class-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
.class-card:hover{border-color:#93c5fd;box-shadow:0 2px 8px rgba(37,99,235,.1);}
.class-icon{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.profile-tabs{display:flex;gap:0;border-bottom:1px solid #e2e8f0;margin-bottom:16px;overflow-x:auto;}
.ptab{padding:9px 16px;font-size:13px;font-weight:500;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.ptab.active{color:#2563eb;border-bottom-color:#2563eb;}
.ptab:hover:not(.active){color:#0f172a;}
.ann-tab{padding:8px 14px;font-size:13px;font-weight:500;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.ann-tab.active{color:#2563eb;border-bottom-color:#2563eb;}
.two-col{display:grid;grid-template-columns:1fr 280px;gap:16px;}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.pg-btn{width:30px;height:30px;border-radius:6px;border:1px solid #e2e8f0;background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;font-weight:500;color:#475569;font-family:inherit;}
.pg-btn.active{background:#2563eb;color:#fff;border-color:#2563eb;}
.pg-btn:hover:not(.active){background:#f1f5f9;}
.progress-wrap{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;}
.map-wrap{border-radius:10px;position:relative;overflow:hidden;background:linear-gradient(135deg,#dde8dd 0%,#cce0cc 50%,#d5e8d5 100%);}
.bus-pin{position:absolute;background:#fff;border-radius:8px;padding:6px 9px;box-shadow:0 2px 8px rgba(0,0,0,.15);min-width:90px;}
.bus-pin-row{display:flex;align-items:center;gap:5px;}
.bus-dot{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.bus-name{font-size:11.5px;font-weight:700;color:#0f172a;}
.bus-status{font-size:10.5px;font-weight:500;margin-top:1px;}
.bus-speed{font-size:9.5px;color:#94a3b8;}
.map-ctrl{position:absolute;bottom:10px;right:10px;display:flex;flex-direction:column;gap:4px;}
.map-btn{width:28px;height:28px;background:#fff;border:1px solid #ddd;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:#555;font-weight:700;line-height:1;}
.map-toggle{position:absolute;top:10px;right:10px;display:flex;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1);}
.map-toggle button{padding:5px 12px;font-size:11px;font-weight:600;border:none;cursor:pointer;font-family:inherit;}
.alert-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9;}
.alert-row:last-child{border-bottom:none;}
.mini-stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;}
.mini-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
input[type=text],select{border:1px solid #e2e8f0;border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;color:#0f172a;background:#fff;outline:none;}
input[type=text]:focus,select:focus{border-color:#93c5fd;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}
.ava-sm{width:34px;height:34px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#64748b;flex-shrink:0;}
@media(max-width:960px){.two-col{grid-template-columns:1fr;}.class-grid{grid-template-columns:repeat(2,1fr);}.three-col{grid-template-columns:1fr;}}
</style>
</head>
<body>

<aside id="sidebar"></aside>
<div id="main">
  <header id="topbar"></header>
  <div id="content"></div>
</div>

<script>
// ─── SVG icon factory ──────────────────────────────────────────────────────
const PATHS = {
  home:     '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  bus:      '<rect x="1" y="3" width="22" height="16" rx="2"/><path d="M1 9h22M8 19v2M16 19v2M1 13h22"/>',
  users:    '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  book:     '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  checksq:  '<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  bar:      '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
  mega:     '<path d="M18 8a5 5 0 0 1 0 8M3 8v8a1 1 0 0 0 1 1h2l3 3V5L6 8H4a1 1 0 0 0-1 1z"/><line x1="21" y1="5" x2="21" y2="19"/>',
  usercog:  '<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><circle cx="19" cy="11" r="2"/><path d="M19 8v1M19 13v1M16.5 9.5l.7.7M21.5 12.5l.7.7M16.5 12.5l.7-.7M21.5 9.5l.7-.7"/>',
  file:     '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  search:   '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  bell:     '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  chevd:    '<polyline points="6 9 12 15 18 9"/>',
  chevr:    '<polyline points="9 18 15 12 9 6"/>',
  chevl:    '<polyline points="15 18 9 12 15 6"/>',
  plus:     '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  eye:      '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  edit:     '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',
  more:     '<circle cx="12" cy="5" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/>',
  pin:      '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  alert:    '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  info:     '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
  checkc:   '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
  shield:   '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  grad:     '<path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',

  clock:    '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 8 14"/>',
  send:     '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
  phone:    '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>',

function ic(name, color='currentColor', size=16) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${PATHS[name]||''}</svg>`;
}

// ─── State ─────────────────────────────────────────────────────────────────
let currentClass = 'Class 5';
let currentStudent = 'Aarav Sharma';

// ─── Navigation ────────────────────────────────────────────────────────────
function navigate(page, extra) {
  if (page === 'class-students' && extra) currentClass = extra;
  if (page === 'student-profile' && extra) currentStudent = extra;

  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  const target = document.getElementById('page-' + page);
  if (target) target.classList.add('active');

  const navPage = (page==='class-students'||page==='student-profile') ? 'students' : page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page===navPage));
  document.getElementById('content').scrollTop = 0;

  // Update dynamic content
  if (page === 'class-students') renderClassStudents();
  if (page === 'student-profile') renderStudentProfile();
}

// ─── Sidebar ──────────────────────────────────────────────────────────────
document.getElementById('sidebar').innerHTML = `
  <div class="logo">
    <div class="logo-brand"><span class="edu">Edu</span><span class="care">Care</span></div>
    <div class="logo-sub">Schools. Safer. Smarter. Together.</div>
  </div>
  <nav>
    ${[
      ['dashboard','home','Dashboard'],
      ['transport','bus','Transport'],
      ['students','users','Students'],
      ['academics','book','Academics'],
      ['attendance','checksq','Attendance'],
      ['results','bar','Results'],
      ['announcements','mega','Announcements'],
      ['staff','usercog','Staff &amp; Drivers'],
      ['reports','file','Reports'],
      ['settings','settings','Settings'],
    ].map(([p,icn,lbl])=>`
      <button class="nav-item${p==='dashboard'?' active':''}" data-page="${p}" onclick="navigate('${p}')">${ic(icn)} ${lbl}</button>
    `).join('')}
  </nav>
  <div class="school-card">
    <div class="school-icon">${ic('shield','white',18)}</div>
    <div>
      <div class="school-name">Greenwood International School</div>
      <div class="school-tag">Learn · Grow · Belong</div>
    </div>
  </div>`;

// ─── Topbar ────────────────────────────────────────────────────────────────
document.getElementById('topbar').innerHTML = `
  <div class="search-box">${ic('search','#94a3b8')} Search students, staff, routes...</div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
    <div class="date-badge">${ic('calendar','#64748b',14)} Mon, 9 Sep 2026</div>
    <div class="notif-btn">${ic('bell','#64748b',16)}<span class="notif-dot">3</span></div>
    <div class="user-info">
      <div class="avatar">P</div>
      <div><div class="user-role">Principal</div><div class="user-name">Dr. Ananya Rao</div></div>
      ${ic('chevd','#94a3b8',14)}
    </div>
  </div>`;

// ─── Dashboard ─────────────────────────────────────────────────────────────
function renderDashboard() {
  const stats = [
    ['#dbeafe','users','#2563eb','Total Students','1,248','↑ +12% vs. last month','#16a34a'],
    ['#dcfce7','checkc','#16a34a','Present Today','1,196','95.8%','#16a34a'],
    ['#fee2e2','userx','#dc2626','Absent Today','52','4.2%','#dc2626'],
    ['#dbeafe','bus','#2563eb','Total Buses','18','Active Today','#64748b'],
    ['#dcfce7','checkc','#16a34a','On Time','16','88.9%','#16a34a'],
    ['#fef3c7','clock','#d97706','Delayed','2','11.1%','#d97706'],
  ];
  const routes = [
    ['Route 1','On Time','28/28'],['Route 2','On Time','32/32'],['Route 3','On Time','26/26'],
    ['Route 4','12 min delay','24/26'],['Route 5','On Time','30/30'],
  ];
  return `
  <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:16px;flex-wrap:wrap;">

            </div>`).join('')}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function switchSettings(el, panelId) {
  document.querySelectorAll('.settings-panel').forEach(p => p.style.display='none');
  document.getElementById(panelId).style.display='block';
  document.querySelectorAll('#settings-nav .nav-item').forEach(b => {
    b.style.background='none'; b.style.color='#64748b';
    b.querySelectorAll('svg').forEach(s => s.style.stroke='#64748b');
  });
  el.style.background='#eff6ff'; el.style.color='#2563eb';
}

// ─── Tab helper ─────────────────────────────────────────────────────────────
function setTab(el, groupId) {
  document.querySelectorAll(`#${groupId} .${el.className.split(' ')[0]}`).forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

`;
